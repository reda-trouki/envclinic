name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test the built CLI
        run: node dist/cli/index.js --version

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Install the packed tarball in a clean project
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y
          npm install "$RUNNER_TEMP"/envclinic-*.tgz
          npx envclinic --version
          printf 'A=1\n' > .env
          printf 'A=\n' > .env.example
          npx envclinic audit --ci
          node --input-type=module -e "import { audit } from 'envclinic'; console.log((await audit()).success)"
          node -e "require('envclinic').audit().then(r => console.log(r.success))"
